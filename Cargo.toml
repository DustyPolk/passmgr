[package]
name = "passmgr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A simple, secure local password manager"
license = "MIT"
repository = "https://github.com/DustyPolk/passmgr"
readme = "README.md"

[dependencies]
# Direct only to turn on `zeroize` for the key schedule inside `Aes256Gcm`.
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
# Vetted constant-time comparison (already in the tree through aes-gcm); a hand-written XOR loop is not guaranteed to stay constant-time.
subtle = "2.6"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
